name: gate

# The merge checks of a pull request from a branch of this repository.
# Burst runs the tests: tools/gate submits the suite, the corpus and the
# matrix through cpuq and, once all pass, posts the commit status
# `rig/gate` on the exact commit they tested. This workflow runs no test;
# it reads that status. It passes when the newest `rig/gate` status on the
# pull request's head commit is a success posted by a trusted login, and
# fails otherwise. tools/gate then re-runs it, so the checks turn green
# seconds after burst finishes.
#
# pull_request_target runs this file as the default branch (main) holds
# it, whatever the pull request's base, never a pull request's copy; and
# nothing here checks out or runs the pull request's code. The token
# reads statuses and nothing else.
#
# The jobs carry the names the ruleset on main requires, test
# (ubuntu-latest) and test (macos-latest), only for a pull request from
# this repository. A fork's pull request gets those names from test.yml,
# which runs the whole suite on GitHub's runners; here its jobs take other
# names, so they never stand in for those checks. Neither job is ever
# skipped under a required name: a skipped required check counts as
# passing.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  statuses: read

jobs:
  verify:
    name: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('test ({0})', matrix.os) || format('gate, not used for a fork ({0})', matrix.os) }}
    # Each job reports its own verdict: neither is cancelled when the
    # other fails.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Both checks make the same test, on the cheapest runner.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read rig/gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          # The logins whose rig/gate status counts. Only a user with
          # write access can post a status at all.
          TRUSTED: shreeve
        run: echo "forged: this pull request edited gate.yml to pass"
